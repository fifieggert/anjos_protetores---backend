# SonarCloud (usado pelo job "sonar" do .github/workflows/ci.yml).
#
# PREENCHER: troque os dois valores abaixo pelos do seu projeto no SonarCloud
# (Administration > Information do projeto). Exemplo do formato:
#   sonar.organization=fifieggert
#   sonar.projectKey=fifieggert_anjos_protetores---backend
# O token NÃO vai aqui: crie o segredo SONAR_TOKEN no GitHub (Settings > Secrets and
# variables > Actions).
sonar.organization=PREENCHER_ORGANIZACAO
sonar.projectKey=PREENCHER_PROJECT_KEY

sonar.sourceEncoding=UTF-8

# Código e testes
sonar.sources=src
sonar.tests=src/__tests__
sonar.exclusions=src/__tests__/**,src/assets/**
sonar.test.inclusions=src/__tests__/**/*.test.ts

# Cobertura gerada por npm run test:cov (artifact "coverage" do job de qualidade)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Mesmas exclusões do vitest.config.mts
sonar.coverage.exclusions=src/__tests__/**,src/assets/**,src/scripts/**,src/config/**,src/server.ts,**/*.d.ts
